<script>
document.addEventListener('DOMContentLoaded', () => {
    const v1 = document.getElementById('my-video');
    const v2 = document.getElementById('my-video2');
    // Forzamos que el ID de usuario sea un número válido
    const uId = "1";
  //  <?php echo isset($_SESSION["user_id"]) ? $_SESSION["user_id"] : "0"; ?>;

    if (uId > 0) {
        const registrar = (videoId, action) => {
            const datos = {
                userid: uId,
                videoId: videoId,
                action: action,
                time: new Date().toISOString()
            };

            console.log("Intentando enviar:", datos);

            fetch('log_activity.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos) // Esto es lo que lee php://input
            })
            .then(res => res.text()) // Cambiamos a text() temporalmente para ver errores
            .then(texto => {
                console.log("Respuesta bruta del servidor:", texto);
                try {
                    const json = JSON.parse(texto);
                    console.log("JSON procesado:", json);
                } catch(e) {
                    console.error("El servidor no devolvió un JSON válido");
                }
            })
            .catch(err => console.error("Error en el envío:", err));
        };

        if(v1) {
            v1.onplay = () => registrar('video-bunny', 'play');
            v1.onpause = () => registrar('video-bunny', 'pause');
        }
        if(v2) {
            v2.onplay = () => registrar('video-anime', 'play');
            v2.onpause = () => registrar('video-anime', 'pause');
        }
    }
});
</script>
